# Récupère les prévisions toutes les 3 heures, construit le site statique et le publie sur GitHub Pages.
# Aucun secret ni clé API n'est nécessaire.
# Sécurité : actions épinglées par SHA de commit (mises à jour par Dependabot), permissions minimales par job.
name: Prévisions et déploiement

on:
  schedule:
    - cron: '20 */3 * * *' # toutes les 3 h (UTC), décalé de l'heure pile pour éviter les pics
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm test
      # En cas d'échec (API indisponible), le job échoue et la version déjà en ligne reste servie.
      - name: Prévisions Open-Meteo et indice Kp NOAA
        run: npm run fetch:weather
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
